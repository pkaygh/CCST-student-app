<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCST Student Portal</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#27ae60">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --nursing-color: #e74c3c;
            --midwifery-color: #9b59b6;
            --lab-color: #27ae60;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
        }

        #dashboard-container {
            display: none;
            padding: 0;
            overflow: hidden;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* SYNC SPINNER OVERLAY */
        #sync-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .dash-header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .notif-box {
            margin: 15px;
            padding: 15px;
            background: #fff3cd;
            border-left: 5px solid #ffcc00;
            display: none;
            border-radius: 8px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div id="sync-overlay">
        <div class="loader"
            style="border: 4px solid #f3f3f3; border-top: 4px solid #27ae60; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;">
        </div>
        <p id="sync-text" style="margin-top: 15px; font-weight: bold; color: #2c3e50;">Syncing with CCST Database...</p>
    </div>

    <div class="card-container" id="auth-container">
        <h2 id="form-title" style="text-align: center;">Student Login</h2>
        <form id="main-form">
            <div id="name-field" class="form-group" style="display:none;"><label>FULL NAME</label><input type="text"
                    id="fullname"></div>
            <div class="form-group"><label>EMAIL</label><input type="email" id="email" required></div>
            <div class="form-group"><label>PASSWORD</label><input type="password" id="password" required></div>
            <div id="prog-field" class="form-group" style="display:none;"><label>PROGRAM</label>
                <select id="program">
                    <option>Nursing</option>
                    <option>Midwifery</option>
                    <option>Medical Laboratory</option>
                </select>
            </div>
            <button type="submit" id="action-btn">Login</button>
        </form>
        <p style="text-align: center; font-size: 0.8rem; margin-top: 15px;">
            <a href="#" onclick="toggleMode()" id="toggle-text"
                style="color:var(--accent-color); text-decoration:none;">New student? Register</a>
        </p>
    </div>

    <div class="card-container" id="dashboard-container">
        <div class="dash-header" id="dash-head">
            <h2 id="user-name">Student</h2>
            <div id="user-prog" style="font-size: 0.7rem; opacity: 0.9;">PROGRAM</div>
        </div>
        <div class="notif-box" id="notif-box"><strong>Notice:</strong> <span id="notif-text"></span></div>
        <div class="stat-grid">
            <div class="stat-box"><small>GPA</small><br><strong id="user-gpa">0.00</strong></div>
            <div class="stat-box"><small>FEES</small><br><strong id="user-fees">Pending</strong></div>
        </div>
        <button onclick="location.reload()"
            style="background:none; color:#999; text-decoration:underline;">Logout</button>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwpkYMLmEh0E_-8k1cfbO2XFJPvdUQV23mDvbYBItCF9p788nPuzVV9LFHuBfqKT55-Pw/exec';
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? "Student Login" : "Register Account";
            document.getElementById('name-field').style.display = isLogin ? "none" : "block";
            document.getElementById('prog-field').style.display = isLogin ? "none" : "block";
            document.getElementById('action-btn').innerText = isLogin ? "Login" : "Register";
        }

        document.getElementById('main-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const overlay = document.getElementById('sync-overlay');
            const email = document.getElementById('email').value;
            overlay.style.display = 'flex';

            const payload = {
                action: isLogin ? 'login' : 'register',
                email: email,
                password: document.getElementById('password').value,
                fullname: document.getElementById('fullname').value || "Student",
                program: document.getElementById('program').value
            };

            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
                .then(() => {
                    // Give the sheet 2 seconds to process before fetching
                    return new Promise(resolve => setTimeout(resolve, 2000));
                })
                .then(() => fetch(`${SCRIPT_URL}?email=${email}`))
                .then(res => res.json())
                .then(student => {
                    if (student.error) throw new Error();
                    overlay.style.display = 'none';
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('dashboard-container').style.display = 'block';
                    document.getElementById('user-name').innerText = student.name;
                    document.getElementById('user-gpa').innerText = student.gpa;
                    document.getElementById('user-fees').innerText = student.fees;

                    if (student.notification) {
                        document.getElementById('notif-text').innerText = student.notification;
                        document.getElementById('notif-box').style.display = 'block';
                    }
                })
                .catch(() => {
                    overlay.style.display = 'none';
                    alert("Account not found. If you just registered, wait 5 seconds and try logging in.");
                });
        });
    </script>
    <style>
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</body>

</html>
