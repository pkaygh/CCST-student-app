<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCST Student Portal | Ready</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --nursing-color: #e74c3c;
            --midwifery-color: #9b59b6;
            --lab-color: #27ae60;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- UI CONTAINERS --- */
        .card-container {
            background: rgba(255, 255, 255, 0.98);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 450px;
            transition: all 0.3s ease;
        }

        #dashboard-container {
            display: none;
            padding: 0;
            max-width: 600px;
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- FORM STYLES --- */
        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border 0.3s;
        }

        input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, background 0.3s;
        }

        button:active {
            transform: scale(0.98);
        }

        /* --- DASHBOARD ELEMENTS --- */
        .dash-header {
            background: var(--primary-color);
            color: white;
            padding: 25px;
            position: relative;
        }

        .notif-dot {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff4757;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: none;
            box-shadow: 0 0 10px #ff4757;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #eee;
        }

        .stat-box small {
            color: #888;
            display: block;
            font-size: 0.7rem;
            margin-bottom: 5px;
        }

        .stat-box strong {
            font-size: 1.4rem;
            color: var(--primary-color);
        }

        .notif-box {
            margin: 0 20px 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 10px;
            border-left: 5px solid #ffcc00;
            display: none;
            font-size: 0.85rem;
        }

        .event-list {
            padding: 0 20px 20px;
        }

        .event-item {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 4px solid var(--accent-color);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="card-container" id="auth-container">
        <h2 id="form-title" style="text-align: center; margin-top: 0;">CCST Student Portal</h2>
        <p id="form-sub" style="text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 25px;">Enter
            credentials to login</p>

        <form id="main-form">
            <div class="form-group" id="name-field" style="display: none;">
                <label>FULL NAME</label>
                <input type="text" id="fullname" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="email" required placeholder="student@college.edu">
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div class="form-group" id="prog-field" style="display: none;">
                <label>ACADEMIC PROGRAM</label>
                <select id="program">
                    <option value="Nursing">Nursing</option>
                    <option value="Midwifery">Midwifery</option>
                    <option value="Medical Laboratory">Medical Laboratory</option>
                </select>
            </div>
            <button type="submit" id="action-btn">Login</button>
        </form>

        <p style="text-align: center; font-size: 0.85rem; margin-top: 20px;">
            <span id="toggle-link">New student? <a href="#" onclick="toggleMode()"
                    style="color:var(--accent-color); font-weight:bold; text-decoration:none;">Register here</a></span>
        </p>
    </div>

    <div class="card-container" id="dashboard-container">
        <div class="dash-header" id="dash-head">
            <div class="notif-dot" id="notif-dot"></div>
            <small style="opacity: 0.8;">Verified Student</small>
            <h2 id="user-name" style="margin: 5px 0 0 0;">Student Name</h2>
            <div id="user-prog"
                style="font-size: 0.7rem; margin-top: 8px; font-weight: bold; background: rgba(255,255,255,0.2); display: inline-block; padding: 3px 10px; border-radius: 5px;">
                PROGRAM</div>
        </div>

        <div class="notif-box" id="notif-box">
            <strong>Notice:</strong> <span id="notif-text">Loading message...</span>
        </div>

        <div class="stat-grid">
            <div class="stat-box">
                <small>GPA</small>
                <strong id="user-gpa">0.00</strong>
            </div>
            <div class="stat-box">
                <small>FEES STATUS</small>
                <strong id="user-fees" style="font-size: 1rem;">Pending</strong>
            </div>
        </div>

        <div class="event-list">
            <h4 style="margin-bottom: 12px; font-size: 0.9rem;">Upcoming Events</h4>
            <div class="event-item">Mid-Semester Exams <br><small style="color:#888;">Oct 15 - Oct 22</small></div>
            <div class="event-item" style="border-left-color: #f39c12;">Matriculation Ceremony <br><small
                    style="color:#888;">Nov 10</small></div>
        </div>

        <div style="text-align: center; padding-bottom: 20px;">
            <button onclick="location.reload()"
                style="background: transparent; color: #999; width: auto; font-size: 0.75rem; text-decoration: underline;">Secure
                Logout</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5APD8vp8BXmflzQ9JaRXjtrpxl217KctxaG9QdVo2n-q8iULuyS0w2DImKGHLhmpkpQ/exec';
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? "Student Login" : "Register Account";
            document.getElementById('name-field').style.display = isLogin ? "none" : "block";
            document.getElementById('prog-field').style.display = isLogin ? "none" : "block";
            document.getElementById('action-btn').innerText = isLogin ? "Login" : "Register";
            document.getElementById('toggle-link').innerHTML = isLogin ?
                "New student? <a href='#' onclick='toggleMode()' style='color:var(--accent-color); font-weight:bold; text-decoration:none;'>Register here</a>" :
                "Existing student? <a href='#' onclick='toggleMode()' style='color:var(--accent-color); font-weight:bold; text-decoration:none;'>Login here</a>";
        }

        document.getElementById('main-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const btn = document.getElementById('action-btn');
            const email = document.getElementById('email').value;

            btn.innerText = "Processing...";
            btn.disabled = true;

            const payload = {
                action: isLogin ? 'login' : 'register',
                email: email,
                password: document.getElementById('password').value,
                fullname: document.getElementById('fullname').value || "Student",
                program: document.getElementById('program').value
            };

            // 1. SEND DATA TO SHEET (POST)
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            })
                .then(() => {
                    // 2. FETCH LIVE DATA (GET)
                    btn.innerText = "Syncing Data...";
                    return fetch(`${SCRIPT_URL}?email=${email}`);
                })
                .then(res => res.json())
                .then(student => {
                    // 3. SHOW DASHBOARD
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('dashboard-container').style.display = 'block';

                    // 4. MAP SHEET DATA TO UI
                    document.getElementById('user-name').innerText = student.name;
                    document.getElementById('user-prog').innerText = student.program.toUpperCase();
                    document.getElementById('user-gpa').innerText = student.gpa;
                    document.getElementById('user-fees').innerText = student.fees;

                    // Apply Dynamic Theme Color
                    let themeColor = 'var(--accent-color)';
                    if (student.program === 'Nursing') themeColor = 'var(--nursing-color)';
                    if (student.program === 'Midwifery') themeColor = 'var(--midwifery-color)';
                    if (student.program === 'Medical Laboratory') themeColor = 'var(--lab-color)';
                    document.getElementById('dash-head').style.backgroundColor = themeColor;

                    // Push Notification Logic
                    if (student.notification && student.notification.trim() !== "") {
                        document.getElementById('notif-text').innerText = student.notification;
                        document.getElementById('notif-box').style.display = 'block';
                        document.getElementById('notif-dot').style.display = 'block';
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("Login Error: Ensure email is correct and account exists.");
                })
                .finally(() => {
                    btn.innerText = isLogin ? "Login" : "Register";
                    btn.disabled = false;
                });
        });
    </script>
</body>

</html>
