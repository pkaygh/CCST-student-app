<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCST Student Portal</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#27ae60">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --nursing-color: #e74c3c;
            --midwifery-color: #9b59b6;
            --lab-color: #27ae60;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            overflow: hidden;
        }

        .padding-box {
            padding: 2rem;
        }

        #dashboard-container {
            display: none;
        }

        /* AUTH STYLES */
        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* DASHBOARD */
        .dash-header {
            background: var(--primary-color);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            background: #eee;
            margin-bottom: 10px;
        }

        .section-title {
            padding: 15px 20px 5px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
        }

        .course-grid {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 20px 20px;
            scrollbar-width: none;
        }

        .course-card {
            min-width: 100px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            border-top: 3px solid var(--accent-color);
            font-size: 0.75rem;
            text-align: center;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px 20px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #eee;
        }

        .stat-box small {
            color: #888;
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        /* ACCORDIONS */
        .accordion {
            background: #fff;
            margin: 0 20px 10px;
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
        }

        .acc-header {
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.8rem;
            background: #fafafa;
        }

        .acc-content {
            padding: 15px;
            display: none;
            font-size: 0.75rem;
            line-height: 1.5;
            border-top: 1px solid #eee;
            white-space: pre-line;
        }

        /* OVERLAYS */
        #sync-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--lab-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div id="sync-overlay">
        <div class="loader"></div>
        <p style="margin-top:15px; font-weight:bold; color:var(--primary-color);">Syncing Database...</p>
    </div>

    <div class="card-container" id="auth-container">
        <div class="padding-box">
            <h2 id="form-title" style="text-align:center;">Student Login</h2>
            <form id="main-form">
                <div id="name-field" class="form-group" style="display:none;"><label>FULL NAME</label><input type="text"
                        id="fullname"></div>
                <div class="form-group"><label>EMAIL</label><input type="email" id="email" required></div>
                <div class="form-group"><label>PASSWORD</label><input type="password" id="password" required></div>
                <div id="prog-field" class="form-group" style="display:none;"><label>PROGRAM</label>
                    <select id="program">
                        <option>Nursing</option>
                        <option>Midwifery</option>
                        <option>Medical Laboratory</option>
                    </select>
                </div>
                <button type="submit" id="action-btn">Login</button>
            </form>
            <p style="text-align:center; font-size:0.8rem; margin-top:20px;">
                <a href="#" onclick="toggleMode()" id="toggle-text"
                    style="color:var(--accent-color); text-decoration:none; font-weight:bold;">New student? Register</a>
            </p>
        </div>
    </div>

    <div class="card-container" id="dashboard-container">
        <div class="dash-header" id="dash-head">
            <img src="" id="profile-pic" class="profile-img">
            <h2 id="user-name" style="margin:0; font-size:1.1rem;">Student Name</h2>
            <div id="user-prog" style="font-size:0.7rem; opacity:0.8; margin-top:5px; font-weight:bold;">PROGRAM</div>
        </div>

        <div class="section-title">Current Semester Courses</div>
        <div class="course-grid" id="course-list"></div>

        <div class="stat-grid">
            <div class="stat-box"><small>Current GPA</small><br><strong id="user-gpa">0.00</strong></div>
            <div class="stat-box"><small>Fees Status</small><br><strong id="user-fees"
                    style="color:var(--lab-color);">Pending</strong></div>
        </div>

        <div class="accordion">
            <div class="acc-header" onclick="toggleAcc('acc-history')">Results History <span>▼</span></div>
            <div id="acc-history" class="acc-content"></div>
        </div>

        <div class="accordion" style="margin-bottom:20px;">
            <div class="acc-header" onclick="toggleAcc('acc-fees')">Fee Breakdown <span>▼</span></div>
            <div id="acc-fees" class="acc-content"></div>
        </div>

        <div style="text-align:center; padding-bottom:20px;">
            <button onclick="location.reload()"
                style="background:none; color:#999; text-decoration:underline; width:auto; font-size:0.7rem; border:none;">Logout</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzsl2VN7xukVYNy3hoJQfdIzqp7ClDb5zwl41Mlvasw_iVHjhM3t5YKEyIoH6lom7OduA/exec';
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? "Student Login" : "Register Account";
            document.getElementById('name-field').style.display = isLogin ? "none" : "block";
            document.getElementById('prog-field').style.display = isLogin ? "none" : "block";
            document.getElementById('action-btn').innerText = isLogin ? "Login" : "Register";
            document.getElementById('toggle-text').innerText = isLogin ? "New student? Register" : "Have an account? Login";
        }

        function toggleAcc(id) {
            const content = document.getElementById(id);
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
        }

        document.getElementById('main-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const overlay = document.getElementById('sync-overlay');
            const email = document.getElementById('email').value;
            overlay.style.display = 'flex';

            const payload = {
                action: isLogin ? 'login' : 'register',
                email: email,
                password: document.getElementById('password').value,
                fullname: document.getElementById('fullname').value || "Student",
                program: document.getElementById('program').value
            };

            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
                .then(() => new Promise(res => setTimeout(res, 2500)))
                .then(() => fetch(`${SCRIPT_URL}?email=${email}`))
                .then(res => res.json())
                .then(student => {
                    if (student.error) throw new Error();
                    overlay.style.display = 'none';
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('dashboard-container').style.display = 'block';

                    document.getElementById('user-name').innerText = student.name;
                    document.getElementById('user-prog').innerText = student.program.toUpperCase();
                    document.getElementById('profile-pic').src = `https://ui-avatars.com/api/?name=${student.name}&background=random&color=fff`;

                    document.getElementById('user-gpa').innerText = student.gpa;
                    document.getElementById('user-fees').innerText = student.fees;

                    let color = 'var(--accent-color)';
                    if (student.program === 'Nursing') color = 'var(--nursing-color)';
                    if (student.program === 'Midwifery') color = 'var(--midwifery-color)';
                    if (student.program === 'Medical Laboratory') color = 'var(--lab-color)';
                    document.getElementById('dash-head').style.backgroundColor = color;

                    const cList = document.getElementById('course-list');
                    cList.innerHTML = '';
                    student.courses.split(',').forEach(c => {
                        cList.innerHTML += `<div class="course-card" style="border-top-color:${color}">${c.trim()}</div>`;
                    });

                    document.getElementById('acc-history').innerText = student.history;
                    document.getElementById('acc-fees').innerText = student.feeDetail;
                })
                .catch(() => {
                    overlay.style.display = 'none';
                    alert("Login Error: Ensure account details match the database.");
                });
        });
    </script>
</body>

</html>
