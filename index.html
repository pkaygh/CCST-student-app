<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCST Student Portal</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #f4f7f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* AUTH SECTION */
        #auth-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            z-index: 2000;
        }

        .auth-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 380px;
        }

        /* SIDEBAR LOGIC */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--primary-color);
            color: white;
            position: fixed;
            height: 100vh;
            left: -260px;
            transition: 0.3s;
            z-index: 1000;
        }

        #sidebar.active {
            left: 0;
        }

        .nav-item {
            padding: 15px 25px;
            cursor: pointer;
            border-left: 4px solid transparent;
            list-style: none;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            border-left-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.05);
        }

        /* CONTENT LOGIC */
        #main-content {
            flex: 1;
            transition: 0.3s;
            margin-left: 0;
            padding-top: 60px;
        }

        .top-bar {
            background: white;
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 999;
        }

        .page {
            display: none;
            padding: 30px;
        }

        .page.active {
            display: block;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
            margin-bottom: 20px;
        }

        #sync-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div id="sync-overlay">Loading...</div>

    <div id="auth-container">
        <div class="auth-card">
            <h2 id="title" style="text-align:center;">CCST Login</h2>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required
                    style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
                <input type="password" id="pass" placeholder="Password" required
                    style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
                <button type="submit"
                    style="width:100%; padding:12px; background:var(--accent-color); color:white; border:none; border-radius:8px;">Login</button>
            </form>
        </div>
    </div>

    <nav id="sidebar">
        <div style="padding:40px 20px; text-align:center; border-bottom:1px solid #444;">
            <img id="side-img" src="" style="width:70px; border-radius:50%; background:#eee;">
            <h4 id="side-name" style="margin:10px 0 0;">Student</h4>
        </div>
        <ul style="padding:0;">
            <li class="nav-item active" onclick="showPage('home', this)">🏠 Dashboard</li>
            <li class="nav-item" onclick="showPage('courses', this)">📚 Courses</li>
            <li class="nav-item" onclick="showPage('grades', this)">📊 Grades</li>
            <li class="nav-item" onclick="showPage('fees', this)">💰 Fees</li>
            <li class="nav-item" style="color:red; margin-top:30px;" onclick="location.reload()">Logout</li>
        </ul>
    </nav>

    <main id="main-content">
        <div class="top-bar">
            <div onclick="toggleMenu()" style="font-size:24px; cursor:pointer; margin-right:20px;">☰</div>
            <div style="font-weight:bold;">CCST PORTAL</div>
        </div>

        <div id="home" class="page active">
            <h2>Welcome Home</h2>
            <div class="card">GPA: <strong id="u-gpa">0.00</strong></div>
            <div class="card">Status: <strong id="u-fees">Pending</strong></div>
        </div>

        <div id="courses" class="page">
            <h2>My Courses</h2>
            <div id="course-container" class="card"></div>
        </div>

        <div id="grades" class="page">
            <h2>Result History</h2>
            <div id="grade-container" class="card" style="white-space:pre-line;"></div>
        </div>

        <div id="fees" class="page">
            <h2>Fee Breakdown</h2>
            <div id="fee-container" class="card" style="white-space:pre-line;"></div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'PASTE_YOUR_NEW_URL_HERE';

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function showPage(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if (window.innerWidth < 768) toggleMenu();
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const overlay = document.getElementById('sync-overlay');
            overlay.style.display = 'flex';

            fetch(`${SCRIPT_URL}?email=${email}`)
                .then(res => res.json())
                .then(data => {
                    overlay.style.display = 'none';
                    if (data.error) {
                        alert("Error: " + data.error);
                        return;
                    }

                    // Successful Login
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('side-name').innerText = data.name;
                    document.getElementById('u-gpa').innerText = data.gpa;
                    document.getElementById('u-fees').innerText = data.fees;
                    document.getElementById('course-container').innerText = data.courses;
                    document.getElementById('grade-container').innerText = data.history;
                    document.getElementById('fee-container').innerText = data.feeDetail;
                    document.getElementById('side-img').src = `https://ui-avatars.com/api/?name=${data.name}`;
                })
                .catch(err => {
                    overlay.style.display = 'none';
                    alert("Network Error: Could not connect to Google Script. Check your URL.");
                });
        });
    </script>
</body>

</html>
