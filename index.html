<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCST Student Portal</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #f4f7f9;
        }

        /* AUTHENTICATION SCREEN */
        #auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .auth-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 380px;
        }

        .hidden {
            display: none !important;
        }

        /* DASHBOARD LAYOUT */
        #dashboard-wrapper {
            display: none;
            display: flex;
            min-height: 100vh;
        }

        /* LEFT HAND MENU PANEL */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--primary-color);
            color: white;
            position: fixed;
            height: 100vh;
            left: -260px;
            transition: 0.3s;
            z-index: 1000;
        }

        #sidebar.active {
            left: 0;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            margin-bottom: 10px;
        }

        .nav-menu {
            list-style: none;
            padding: 20px 0;
            margin: 0;
        }

        .nav-item {
            padding: 15px 25px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.05);
            border-left-color: var(--accent-color);
            font-weight: bold;
        }

        /* MAIN AREA */
        #main-content {
            flex: 1;
            transition: 0.3s;
            margin-left: 0;
            width: 100%;
        }

        .top-bar {
            background: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
        }

        .menu-btn {
            font-size: 1.5rem;
            cursor: pointer;
            margin-right: 20px;
        }

        .page-content {
            padding: 30px;
            display: none;
            max-width: 1000px;
            margin: auto;
        }

        .page-content.active {
            display: block;
        }

        /* BOX STYLES */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            border: 1px solid #eee;
        }

        /* LOADING OVERLAY */
        #sync-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="sync-overlay">
        <div class="loader"></div>
        <p>Syncing CCST Data...</p>
    </div>

    <div id="auth-container">
        <div class="auth-card">
            <h2 id="form-title" style="text-align:center;">Student Login</h2>
            <form id="main-form">
                <div id="name-field" style="display:none; margin-bottom:15px;"><label>FULL NAME</label><input
                        type="text" id="fullname" style="width:100%; padding:10px;"></div>
                <div style="margin-bottom:15px;"><label>EMAIL</label><input type="email" id="email" required
                        style="width:100%; padding:10px;"></div>
                <div style="margin-bottom:15px;"><label>PASSWORD</label><input type="password" id="password" required
                        style="width:100%; padding:10px;"></div>
                <div id="prog-field" style="display:none; margin-bottom:15px;"><label>PROGRAM</label>
                    <select id="program" style="width:100%; padding:10px;">
                        <option>Nursing</option>
                        <option>Midwifery</option>
                        <option>Medical Laboratory</option>
                    </select>
                </div>
                <button type="submit"
                    style="width:100%; padding:12px; background:var(--accent-color); color:white; border:none; border-radius:8px; cursor:pointer;">Continue</button>
            </form>
            <p style="text-align:center; font-size:0.8rem; margin-top:15px;"><a href="#" onclick="toggleMode()">New
                    student? Register</a></p>
        </div>
    </div>

    <div id="dashboard-wrapper" class="hidden">
        <nav id="sidebar">
            <div class="sidebar-header">
                <img id="side-img" class="profile-img" src="">
                <h3 id="side-name" style="margin:5px 0;">Student</h3>
                <small id="side-prog">PROGRAM</small>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" onclick="switchPage('page-home', this)">🏠 Home Overview</li>
                <li class="nav-item" onclick="switchPage('page-courses', this)">📚 My Courses</li>
                <li class="nav-item" onclick="switchPage('page-grades', this)">📊 Academic Results</li>
                <li class="nav-item" onclick="switchPage('page-fees', this)">💳 Finance & Fees</li>
                <li class="nav-item" style="margin-top:40px; color:#e74c3c" onclick="location.reload()">🔒 Logout</li>
            </ul>
        </nav>

        <main id="main-content">
            <div class="top-bar">
                <div class="menu-btn" onclick="toggleSidebar()">☰</div>
                <div style="font-weight:bold;">CCST PORTAL</div>
            </div>

            <div id="page-home" class="page-content active">
                <h2>Welcome Back</h2>
                <div class="stat-grid">
                    <div class="card"><small>GPA</small><br><strong id="user-gpa"
                            style="font-size:1.5rem;">0.00</strong></div>
                    <div class="card"><small>FEES STATUS</small><br><strong id="user-fees">Pending</strong></div>
                </div>
            </div>

            <div id="page-courses" class="page-content">
                <h2>Current Courses</h2>
                <div id="course-list" class="stat-grid"></div>
            </div>

            <div id="page-grades" class="page-content">
                <h2>Academic History</h2>
                <div id="grade-history" class="card" style="white-space:pre-line;"></div>
            </div>

            <div id="page-fees" class="page-content">
                <h2>Billing Details</h2>
                <div id="fee-details" class="card" style="white-space:pre-line;"></div>
            </div>
        </main>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOPlBCtNE8YABl-QKDq1v5-0Z49yWbSrqLPY5vVlijxMuMca8SCZ0E-YkWwmOP4kA-9g/exec'; // MUST UPDATE THIS
        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? "Student Login" : "Register Account";
            document.getElementById('name-field').style.display = isLogin ? "none" : "block";
            document.getElementById('prog-field').style.display = isLogin ? "none" : "block";
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            const main = document.getElementById('main-content');
            if (window.innerWidth > 768) {
                main.style.marginLeft = main.style.marginLeft === '260px' ? '0' : '260px';
            }
        }

        function switchPage(id, el) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if (window.innerWidth < 768) toggleSidebar();
        }

        document.getElementById('main-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            document.getElementById('sync-overlay').style.display = 'flex';

            const payload = {
                action: isLogin ? 'login' : 'register',
                email: email,
                password: document.getElementById('password').value,
                fullname: document.getElementById('fullname').value || "Student",
                program: document.getElementById('program').value
            };

            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
                .then(() => new Promise(res => setTimeout(res, 2500)))
                .then(() => fetch(`${SCRIPT_URL}?email=${email}`))
                .then(res => res.json())
                .then(student => {
                    if (student.error) throw new Error();
                    document.getElementById('sync-overlay').style.display = 'none';
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('dashboard-wrapper').style.display = 'flex';

                    document.getElementById('side-name').innerText = student.name;
                    document.getElementById('side-prog').innerText = student.program;
                    document.getElementById('user-gpa').innerText = student.gpa;
                    document.getElementById('user-fees').innerText = student.fees;
                    document.getElementById('grade-history').innerText = student.history || "No records.";
                    document.getElementById('fee-details').innerText = student.feeDetail || "No billing data.";
                    document.getElementById('side-img').src = `https://ui-avatars.com/api/?name=${student.name}&background=random&color=fff`;

                    const cList = document.getElementById('course-list');
                    cList.innerHTML = '';
                    (student.courses || "").split(',').forEach(c => {
                        cList.innerHTML += `<div class="card" style="border-left:5px solid var(--accent-color)">${c.trim()}</div>`;
                    });

                    if (window.innerWidth > 768) toggleSidebar();
                })
                .catch(() => {
                    document.getElementById('sync-overlay').style.display = 'none';
                    alert("Account error. Make sure your Script URL is correct and the user exists.");
                });
        });
    </script>
</body>

</html>
