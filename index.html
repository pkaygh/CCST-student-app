<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | CCST</title>
    <style>
        :root { --primary: #004080; --bg: #f4f6f9; --text: #2c3e50; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input, select, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .welcome-hero { background: linear-gradient(135deg, var(--primary), #0056b3); color: white; padding: 30px; border-radius: 15px; }
    </style>
</head>
<body>
<div class="container" id="authPage">
    <div class="card" style="text-align:center;">
        <h2>CCST Login</h2>
        <input id="idEl" placeholder="Student ID (e.g. CCST/RN/24/001)">
        <input id="passEl" type="password" placeholder="Password">
        <button onclick="login()">LOGIN</button>
        <button onclick="register()" style="background:#27ae60; margin-top:10px;">REGISTER FIRST TIME</button>
    </div>
</div>

<div class="container hidden" id="dashboard">
    <div class="welcome-hero">
        <h2 id="greet"></h2>
        <p id="subInfo"></p>
    </div>
    <div id="regCard" class="card" style="margin-top:20px;">
        <h3>Course Registration</h3>
        <div id="statBox" style="padding:15px; border-radius:10px; text-align:center; font-weight:bold;">Checking Clearance...</div>
        <div id="regForm" class="hidden">
            <textarea id="courseInput" placeholder="Enter Course Codes (e.g. NUR101, MAT202)"></textarea>
            <button onclick="submitCourses()" style="background:#27ae60">Submit Registration</button>
        </div>
        <p id="regDone" class="hidden" style="color:#27ae60; font-weight:bold; text-align:center;">✅ You are already registered.</p>
    </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu_CMO2gzqOPQzoWnVWj5dGR2SV88hrZ_a9rhGqGhdNkvbqjsFREkk7Vxh7qBXojf46A/exec";
const $ = (id) => document.getElementById(id);

async function hash(p) {
    const buf = new TextEncoder().encode(p);
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function login() {
    const hPass = await hash($('passEl').value);
    const res = await fetch(`${SCRIPT_URL}?id=${$('idEl').value}&password=${hPass}`);
    const data = await res.json();
    if(data.error) return alert(data.error);
    $('authPage').classList.add('hidden'); $('dashboard').classList.remove('hidden');
    
    // UI Update
    const hr = new Date().getHours();
    const greet = hr < 12 ? "Morning" : hr < 17 ? "Afternoon" : "Evening";
    $('greet').innerText = `Good ${greet}, ${data.profile.name.split(' ')[0]}!`;
    $('subInfo').innerText = `${data.profile.program} | Level ${data.profile.level}`;

    if(data.profile.isCleared) {
        $('statBox').innerText = "✅ Cleared for Registration"; $('statBox').style.background = "#e8f5e9";
        if(data.profile.registeredCourses) $('regDone').classList.remove('hidden'); else $('regForm').classList.remove('hidden');
    } else {
        $('statBox').innerText = "❌ Not Cleared. Visit Accountant."; $('statBox').style.background = "#ffebee";
    }
}

async function register() {
    const hPass = await hash($('passEl').value);
    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'register', id: $('idEl').value, password: hPass, role: 'student' }) });
    alert("Registration successful. Now Login.");
}

async function submitCourses() {
    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'register_courses', id: $('idEl').value, courses: $('courseInput').value }) });
    alert("Registered!"); location.reload();
}
</script>
</body>
</html>
