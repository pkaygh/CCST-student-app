<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCST Student Hub</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#27ae60">

    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --nursing-color: #5ee73c;
            --midwifery-color: #9b59b6;
            --lab-color: #ffffff;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #344969 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-container {
            background: rgba(255, 255, 255, 0.98);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 450px;
            transition: all 0.3s ease;
        }

        #dashboard-container {
            display: none;
            padding: 0;
            max-width: 600px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* FORM STYLES */
        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* DASHBOARD */
        .dash-header {
            background: var(--primary-color);
            color: white;
            padding: 25px;
            position: relative;
        }

        .notif-dot {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff4757;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: none;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #eee;
        }

        .notif-box {
            margin: 0 20px 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 10px;
            border-left: 5px solid #ffcc00;
            display: none;
            font-size: 0.85rem;
        }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #splash-screen img {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--lab-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        .offline-tag {
            background: #7f8c8d;
            color: white;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 10px;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <div id="splash-screen">
        <img src="icon-512.png" alt="CCST Logo">
        <div class="loader"></div>
        <p style="margin-top: 15px; color: #27ae60; font-weight: bold; font-family: sans-serif;">C.C.S.T. PORTAL</p>
    </div>

    <div class="card-container" id="auth-container">
        <h2 style="text-align: center; margin-top: 0;">CCST Student Portal</h2>
        <form id="main-form">
            <div class="form-group" id="name-field" style="display: none;">
                <label>FULL NAME</label>
                <input type="text" id="fullname" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="email" required placeholder="student@college.edu">
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div class="form-group" id="prog-field" style="display: none;">
                <label>ACADEMIC PROGRAM</label>
                <select id="program">
                    <option value="Nursing">Nursing</option>
                    <option value="Midwifery">Midwifery</option>
                    <option value="Medical Laboratory">Medical Laboratory</option>
                </select>
            </div>
            <button type="submit" id="action-btn">Login</button>
        </form>
        <p style="text-align: center; font-size: 0.85rem; margin-top: 20px;">
            <span id="toggle-link">New student? <a href="#" onclick="toggleMode()"
                    style="color:var(--accent-color); font-weight:bold; text-decoration:none;">Register here</a></span>
        </p>
    </div>

    <div class="card-container" id="dashboard-container">
        <div class="dash-header" id="dash-head">
            <div class="notif-dot" id="notif-dot"></div>
            <small style="opacity: 0.8;">Verified Student <span id="status-tag"></span></small>
            <h2 id="user-name" style="margin: 5px 0 0 0;">Student Name</h2>
            <div id="user-prog"
                style="font-size: 0.7rem; margin-top: 8px; font-weight: bold; background: rgba(255,255,255,0.2); display: inline-block; padding: 3px 10px; border-radius: 5px;">
                PROGRAM</div>
        </div>
        <div class="notif-box" id="notif-box"><strong>Notice:</strong> <span id="notif-text"></span></div>
        <div class="stat-grid">
            <div class="stat-box"><small>GPA</small><strong id="user-gpa">0.00</strong></div>
            <div class="stat-box"><small>FEES STATUS</small><strong id="user-fees"
                    style="font-size: 1rem;">Pending</strong></div>
        </div>
        <div style="text-align: center; padding-bottom: 20px;">
            <button onclick="logout()"
                style="background: transparent; color: #999; width: auto; font-size: 0.75rem; text-decoration: underline; border:none;">Secure
                Logout</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5APD8vp8BXmflzQ9JaRXjtrpxl217KctxaG9QdVo2n-q8iULuyS0w2DImKGHLhmpkpQ/exec';
        let isLogin = true;

        window.onload = () => {
            // Check if student was already logged in (Offline Mode)
            const cachedData = localStorage.getItem('ccst_user_data');
            if (cachedData) {
                renderDashboard(JSON.parse(cachedData));
                document.getElementById('status-tag').innerHTML = '<span class="offline-tag">Offline Mode</span>';
            }

            const savedEmail = localStorage.getItem('ccst_email');
            if (savedEmail) document.getElementById('email').value = savedEmail;
        };

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? "Student Login" : "Register Account";
            document.getElementById('name-field').style.display = isLogin ? "none" : "block";
            document.getElementById('prog-field').style.display = isLogin ? "none" : "block";
            document.getElementById('action-btn').innerText = isLogin ? "Login" : "Register";
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function renderDashboard(student) {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('dashboard-container').style.display = 'block';
            document.getElementById('user-name').innerText = student.name;
            document.getElementById('user-prog').innerText = student.program.toUpperCase();
            document.getElementById('user-gpa').innerText = student.gpa;
            document.getElementById('user-fees').innerText = student.fees;

            let themeColor = student.program === 'Nursing' ? 'var(--nursing-color)' :
                student.program === 'Midwifery' ? 'var(--midwifery-color)' :
                    student.program === 'Medical Laboratory' ? 'var(--lab-color)' : 'var(--accent-color)';
            document.getElementById('dash-head').style.backgroundColor = themeColor;

            if (student.notification) {
                document.getElementById('notif-text').innerText = student.notification;
                document.getElementById('notif-box').style.display = 'block';
                document.getElementById('notif-dot').style.display = 'block';
            }
        }

        document.getElementById('main-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const btn = document.getElementById('action-btn');
            const email = document.getElementById('email').value;
            btn.innerText = "Connecting...";
            btn.disabled = true;

            const payload = {
                action: isLogin ? 'login' : 'register',
                email: email,
                password: document.getElementById('password').value,
                fullname: document.getElementById('fullname').value || "Student",
                program: document.getElementById('program').value
            };

            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
                .then(() => fetch(`${SCRIPT_URL}?email=${email}`))
                .then(res => res.json())
                .then(student => {
                    localStorage.setItem('ccst_user_data', JSON.stringify(student));
                    localStorage.setItem('ccst_email', email);
                    document.getElementById('status-tag').innerText = '';
                    renderDashboard(student);
                })
                .catch(err => {
                    const cached = localStorage.getItem('ccst_user_data');
                    if (cached) alert("Working offline. Data may not be up to date.");
                    else alert("Connection error. Please check your internet.");
                })
                .finally(() => { btn.disabled = false; btn.innerText = "Login"; });
        });

        // Splash screen fade
        window.addEventListener('load', () => {
            setTimeout(() => {
                const s = document.getElementById('splash-screen');
                s.style.opacity = '0';
                setTimeout(() => s.style.display = 'none', 500);
            }, 2000);
        });
    </script>
</body>

</html>
